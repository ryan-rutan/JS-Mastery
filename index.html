<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JS Mastery</title>
  <meta name="description" content="An interactive, hands-on way to learn JavaScript: lessons, a live code runner, exercises and quizzes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f7df1e'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='900' font-size='30' text-anchor='middle' fill='%231f1f1d'%3EJS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const t = JSON.parse(localStorage.getItem('jsm-theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle lesson menu">☰</button>
    <a class="brand" href="#/">JS<span>Mastery</span></a>
    <nav class="top-links">
      <a href="#/">Lessons</a>
      <a href="#/lesson/web-intro" class="lab-link">Live Lab</a>
      <a href="#/game">🎮 Code Clash</a>
      <a href="#/playground">Playground</a>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">◐</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="progress-card">
        <div class="progress-label"><span>Your progress</span><span id="progressText">0%</span></div>
        <div class="progress-bar"><div id="progressFill"></div></div>
      </div>
      <nav id="lessonNav"></nav>
      <button class="link-btn reset-btn" id="resetBtn">Reset all progress</button>
    </aside>

    <main class="content" id="app"></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/web-lessons.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/web-lab.js"></script>
  <script src="js/game/rules.js"></script>
  <script src="js/game/missions.js"></script>
  <script src="js/game/clash.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
